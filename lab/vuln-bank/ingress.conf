server {
    listen 80;
    server_name _;
    location / {
        proxy_pass http://vuln-bank:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
