[artex_lab]
homePath = $SPLUNK_DB/artex_lab/db
coldPath = $SPLUNK_DB/artex_lab/colddb
thawedPath = $SPLUNK_DB/artex_lab/thaweddb
maxTotalDataSizeMB = 256
maxDataSize = 16
frozenTimePeriodInSecs = 604800
maxHotBuckets = 2

# The AG collector override writes to this separate index. Define the paths
# before the index is created through the management API so searches can load it.
[ag_juice_shop]
homePath = $SPLUNK_DB/ag_juice_shop/db
coldPath = $SPLUNK_DB/ag_juice_shop/colddb
thawedPath = $SPLUNK_DB/ag_juice_shop/thaweddb
maxTotalDataSizeMB = 256
maxDataSize = 16
frozenTimePeriodInSecs = 604800
maxHotBuckets = 2
